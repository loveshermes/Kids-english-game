<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>幼兒英文單字</title>


  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{
      margin:0;
      min-height:100vh;
      font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;
      background:linear-gradient(180deg,#dff6ff 0%,#fff6d8 100%);
      color:#24324a;
      overflow-x:hidden;
    }
    button{font:inherit;cursor:pointer}
    .screen{display:none;min-height:100vh;padding:24px}
    .screen.active{display:flex;flex-direction:column;align-items:center;justify-content:center}
    .card{
      width:min(920px,94vw);
      background:rgba(255,255,255,.92);
      border-radius:32px;
      padding:32px;
      box-shadow:0 18px 50px rgba(44,68,96,.15);
      border:4px solid rgba(255,255,255,.75);
      text-align:center;
    }
    h1{font-size:clamp(2.2rem,6vw,4.6rem);margin:0 0 12px;line-height:1.05}
    h2{font-size:clamp(1.8rem,4.5vw,3.1rem);margin:0}
    .subtitle{font-size:clamp(1.1rem,2.5vw,1.5rem);margin:8px 0 30px;color:#53647c}
    .hero{font-size:clamp(5rem,18vw,10rem);margin:10px 0 18px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.08))}
    .big-btn{
      border:none;
      border-radius:24px;
      padding:18px 34px;
      min-width:220px;
      background:#ffcf4a;
      color:#23324a;
      font-size:clamp(1.35rem,3vw,2rem);
      box-shadow:0 8px 0 #e2ad20;
      transition:.15s transform,.15s box-shadow;
    }
    .big-btn:active{transform:translateY(6px);box-shadow:0 2px 0 #e2ad20}
    .topbar{
      width:min(980px,96vw);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:18px;
      font-size:clamp(1rem,2vw,1.35rem);
      font-weight:700;
    }
    .pill{background:#fff;border-radius:999px;padding:10px 16px;box-shadow:0 6px 18px rgba(44,68,96,.1)}
    .question-card{width:min(980px,96vw);background:rgba(255,255,255,.94);border-radius:32px;padding:26px;box-shadow:0 18px 50px rgba(44,68,96,.13);text-align:center}
    .speaker{
      border:none;border-radius:50%;width:72px;height:72px;font-size:2rem;background:#8dd7ff;
      box-shadow:0 7px 0 #58b9ef;margin:16px 0 8px;
    }
    .speaker:active{transform:translateY(5px);box-shadow:0 2px 0 #58b9ef}
    .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:26px}
    .choice{
      position:relative;
      min-height:220px;
      border:none;
      border-radius:28px;
      background:#fff;
      box-shadow:0 10px 24px rgba(47,65,90,.12), inset 0 0 0 4px #edf4fb;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      transition:transform .16s ease, box-shadow .16s ease;
      padding:18px;
    }
    .choice:hover{transform:translateY(-4px);box-shadow:0 14px 26px rgba(47,65,90,.16), inset 0 0 0 4px #dbefff}
    .choice .emoji{font-size:clamp(4.6rem,10vw,7rem);line-height:1}
    .animal-img{
      width:clamp(110px,18vw,180px);
      height:clamp(110px,18vw,180px);
      object-fit:contain;
      display:block;
    }
    .hero-images{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      margin:10px 0 18px;
    }
    .hero-images img{
      width:clamp(90px,14vw,130px);
      height:clamp(90px,14vw,130px);
      object-fit:contain;
      display:block;
    }
    .choice .label{
      font-size:clamp(1.15rem,2.5vw,1.6rem);
      margin-top:14px;
      color:#42526a;
      opacity:0;
      visibility:hidden;
      transform:translateY(5px);
      transition:opacity .2s ease,transform .2s ease;
    }
    .choice.reveal-label .label{
      opacity:1;
      visibility:visible;
      transform:translateY(0);
    }

    .choice::after{
      content:'Tap to reveal';
      position:absolute;
      right:12px;
      bottom:8px;
      font-size:.72rem;
      color:#9aa6b6;
      font-weight:700;
      opacity:.75;
      pointer-events:none;
    }
    .choice.reveal-label::after{display:none}

    .choice.correct{animation:pop .45s ease;background:#e9ffe8;box-shadow:0 0 0 7px #8be28c}
    .choice.wrong{animation:shake .38s ease;background:#fff0f0;box-shadow:0 0 0 7px #ffb1b1}
    @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.15) rotate(-2deg)}100%{transform:scale(1)}}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-7px)}}
    .feedback{height:52px;margin-top:18px;font-size:clamp(1.3rem,3vw,2rem);font-weight:800}
    .feedback.good{color:#2f9c47}.feedback.bad{color:#d64c4c}
    .stars{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
    .star{position:absolute;font-size:2rem;animation:floatStar 1.2s ease-out forwards}
    @keyframes floatStar{0%{opacity:0;transform:translateY(15px) scale(.3) rotate(0deg)}30%{opacity:1}100%{opacity:0;transform:translateY(-180px) scale(1.25) rotate(220deg)}}
    .result-score{font-size:clamp(3rem,8vw,5.5rem);font-weight:900;margin:12px 0;color:#f2a900}
    .result-stars{font-size:clamp(2.2rem,6vw,4rem);letter-spacing:5px;margin:8px 0 20px}
    .small-note{font-size:1rem;color:#6b7890;margin-top:18px}

    /* 首頁主題選擇 */
    .category-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:16px;
      margin:22px 0 24px;
    }

    .category-btn{
      border:none;
      border-radius:24px;
      padding:18px 12px;
      background:#fff;
      color:#24324a;
      box-shadow:0 8px 20px rgba(47,65,90,.12),inset 0 0 0 4px #edf4fb;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:7px;
      transition:transform .16s ease,box-shadow .16s ease,background .16s ease;
    }

    .category-btn:hover{
      transform:translateY(-3px);
      box-shadow:0 12px 24px rgba(47,65,90,.16),inset 0 0 0 4px #dbefff;
    }

    .category-btn.selected{
      background:#e9f8ff;
      box-shadow:0 0 0 5px #70cfff,0 10px 24px rgba(47,65,90,.13);
    }

    .category-icon{
      width:88px;
      height:88px;
      object-fit:contain;
      display:block;
      margin:0 auto 2px;
    }

    .category-en{
      font-size:clamp(1.15rem,2.5vw,1.45rem);
      font-weight:800;
    }

    .category-zh{
      font-size:.95rem;
      color:#66758b;
    }

    #startButton:disabled{
      opacity:.45;
      cursor:not-allowed;
      transform:none;
      box-shadow:0 8px 0 #e2ad20;
    }

    .secondary-btn{
      margin-top:14px;
      border:none;
      border-radius:18px;
      padding:12px 20px;
      background:#eef5fb;
      color:#42526a;
      font-weight:800;
      cursor:pointer;
    }

    .topic-pill{
      background:#eef9ff;
    }


    /* 首頁：遊戲模式選擇 */
    .game-mode-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:20px;
      margin:22px 0 10px;
    }

    .game-mode-btn{
      border:none;
      border-radius:28px;
      padding:22px 16px;
      background:#fff;
      color:#24324a;
      box-shadow:0 10px 24px rgba(47,65,90,.12),inset 0 0 0 4px #edf4fb;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:9px;
      transition:transform .16s ease,box-shadow .16s ease;
    }

    .game-mode-btn:hover{
      transform:translateY(-4px);
      box-shadow:0 14px 28px rgba(47,65,90,.16),inset 0 0 0 4px #dbefff;
    }

    .mode-icon{
      width:clamp(120px,18vw,170px);
      height:clamp(120px,18vw,170px);
      object-fit:contain;
      display:block;
    }

    .mode-en{
      font-size:clamp(1.25rem,2.8vw,1.7rem);
      font-weight:900;
    }

    .mode-zh{
      font-size:1rem;
      color:#66758b;
    }

    .menu-title{
      margin-bottom:4px;
    }

    .menu-back{
      margin-top:12px;
    }

    /* 分類遊戲 */
    .sort-card{
      width:min(980px,96vw);
      background:rgba(255,255,255,.94);
      border-radius:32px;
      padding:24px;
      box-shadow:0 18px 50px rgba(44,68,96,.13);
      text-align:center;
    }

    .sort-item-wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height:250px;
      margin:8px 0 14px;
    }

    .drag-instruction{
      margin:4px 0 10px;
      color:#66758b;
      font-size:1rem;
      font-weight:700;
    }

    .drag-stage{
      position:relative;
      width:100%;
      min-height:300px;
      border-radius:26px;
      background:linear-gradient(180deg,#f8fbff 0%,#eef5ff 100%);
      box-shadow:inset 0 0 0 3px #e7effa;
      overflow:hidden;
      margin:8px 0 14px;
      touch-action:none;
    }

    .drag-item{
      position:absolute;
      left:50%;
      top:18px;
      transform:translateX(-50%);
      width:min(250px,72vw);
      min-height:210px;
      border:none;
      border-radius:28px;
      background:#fff;
      box-shadow:0 12px 26px rgba(47,65,90,.14), inset 0 0 0 4px #edf4fb;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:12px 10px 14px;
      cursor:grab;
      user-select:none;
      -webkit-user-select:none;
      touch-action:none;
      z-index:5;
      transition:box-shadow .15s ease, transform .08s linear;
    }

    .drag-item.dragging{
      cursor:grabbing;
      box-shadow:0 18px 32px rgba(47,65,90,.22), inset 0 0 0 4px #dcecff;
    }

    .drag-item.snap-back{
      transition:left .22s ease, top .22s ease, transform .22s ease, box-shadow .15s ease;
    }

    .drop-zone-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
      position:absolute;
      left:0;
      right:0;
      bottom:14px;
      padding:0 8px;
    }

    .drop-zone{
      min-height:135px;
      border-radius:24px;
      background:#fff;
      box-shadow:0 8px 20px rgba(47,65,90,.11), inset 0 0 0 4px #edf4fb;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;
      transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    /* 三個分類框各自有柔和發光效果 */
    .drop-zone[data-category="animals"]{
      animation:glowAnimals 2.4s ease-in-out infinite;
    }

    .drop-zone[data-category="fruits"]{
      animation:glowFruits 2.4s ease-in-out infinite .25s;
    }

    .drop-zone[data-category="vehicles"]{
      animation:glowVehicles 2.4s ease-in-out infinite .5s;
    }

    @keyframes glowAnimals{
      0%,100%{box-shadow:0 8px 20px rgba(47,65,90,.11),inset 0 0 0 4px #edf4fb,0 0 0 rgba(104,180,255,0)}
      50%{box-shadow:0 8px 20px rgba(47,65,90,.11),inset 0 0 0 4px #d9edff,0 0 22px rgba(104,180,255,.45)}
    }

    @keyframes glowFruits{
      0%,100%{box-shadow:0 8px 20px rgba(47,65,90,.11),inset 0 0 0 4px #edf4fb,0 0 0 rgba(118,210,139,0)}
      50%{box-shadow:0 8px 20px rgba(47,65,90,.11),inset 0 0 0 4px #ddf7e2,0 0 22px rgba(118,210,139,.45)}
    }

    @keyframes glowVehicles{
      0%,100%{box-shadow:0 8px 20px rgba(47,65,90,.11),inset 0 0 0 4px #edf4fb,0 0 0 rgba(190,150,255,0)}
      50%{box-shadow:0 8px 20px rgba(47,65,90,.11),inset 0 0 0 4px #eee4ff,0 0 22px rgba(190,150,255,.45)}
    }

    .drop-zone.active-zone{
      animation:none !important;
    }

    .drop-zone.correct{
      animation:correctGlow .65s ease-out forwards !important;
    }

    @keyframes correctGlow{
      0%{transform:scale(1);box-shadow:0 0 0 0 rgba(99,217,122,.1)}
      45%{transform:scale(1.07);box-shadow:0 0 0 9px rgba(99,217,122,.35),0 0 34px rgba(99,217,122,.85)}
      100%{transform:scale(1);box-shadow:0 0 0 7px #8be28c,0 0 24px rgba(99,217,122,.55)}
    }

    .drag-item.fly-in{
      pointer-events:none;
      transition:left .42s cubic-bezier(.22,.8,.24,1),
                 top .42s cubic-bezier(.22,.8,.24,1),
                 transform .42s cubic-bezier(.22,.8,.24,1),
                 opacity .42s ease !important;
      z-index:20;
    }

    .drop-zone.active-zone{
      transform:scale(1.02);
      box-shadow:0 0 0 7px #8fc7ff, 0 8px 20px rgba(47,65,90,.11);
      background:#f4faff;
    }

    .drop-zone.correct{
      background:#e9ffe8;
      box-shadow:0 0 0 7px #8be28c;
      animation:pop .45s ease;
    }

    .drop-zone.wrong{
      background:#fff0f0;
      box-shadow:0 0 0 7px #ffb1b1;
      animation:shake .38s ease;
    }

    .sort-item-img{
      width:clamp(150px,25vw,240px);
      height:clamp(150px,25vw,240px);
      object-fit:contain;
      display:block;
    }

    .sort-word{
      font-size:clamp(1.35rem,3vw,2rem);
      font-weight:900;
      color:#42526a;
      margin-top:6px;
    }

    .sort-category-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
      margin-top:10px;
    }

    .sort-category-btn{
      min-height:150px;
      border:none;
      border-radius:24px;
      padding:12px 8px;
      background:#fff;
      color:#24324a;
      box-shadow:0 8px 20px rgba(47,65,90,.11),inset 0 0 0 4px #edf4fb;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;
      transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
    }

    .sort-category-btn:hover{
      transform:translateY(-3px);
    }

    .sort-category-btn.correct{
      animation:pop .45s ease;
      background:#e9ffe8;
      box-shadow:0 0 0 7px #8be28c;
    }

    .sort-category-btn.wrong{
      animation:shake .38s ease;
      background:#fff0f0;
      box-shadow:0 0 0 7px #ffb1b1;
    }

    .sort-category-img{
      width:84px;
      height:84px;
      object-fit:contain;
      display:block;
    }

    .sort-category-label{
      font-size:clamp(1rem,2.2vw,1.3rem);
      font-weight:900;
    }

    .preview-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin:18px 0;
    }

    .preview-box{
      border-radius:22px;
      background:#fff;
      padding:12px;
      box-shadow:0 6px 16px rgba(47,65,90,.09),inset 0 0 0 3px #edf4fb;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:5px;
    }

    .preview-box img{
      width:76px;
      height:76px;
      object-fit:contain;
    }

    .preview-box strong{
      font-size:1rem;
    }

    /* 手機版：以「一個畫面完成一題」為目標，減少捲動 */
    @media(max-width:760px){
      html,body{min-height:100%;overscroll-behavior:none}

      #home.active{justify-content:center}

      .game-mode-grid{gap:10px;margin:14px 0 8px}
      .game-mode-btn{padding:14px 8px;border-radius:20px}
      .mode-icon{width:105px;height:105px}
      .mode-en{font-size:1.05rem}
      .mode-zh{font-size:.85rem}

      #sortGame.active{justify-content:flex-start}
      .sort-card{width:100%;max-width:560px;padding:10px 12px 12px;border-radius:20px}
      .sort-card h2{font-size:clamp(1.25rem,5.2vw,1.55rem)}
      .sort-item-wrap{min-height:150px;margin:2px 0 6px}

      .drag-instruction{font-size:.9rem;margin:2px 0 7px}
      .drag-stage{min-height:315px;border-radius:20px;margin:6px 0 10px}
      .drag-item{width:min(180px,68vw);min-height:150px;padding:8px 6px 10px;border-radius:20px}
      .drop-zone-grid{gap:7px;bottom:8px;padding:0 2px}
      .drop-zone{min-height:108px;border-radius:18px}

      .sort-item-img{width:clamp(105px,34vw,145px);height:clamp(105px,34vw,145px)}
      .sort-word{font-size:1.2rem;margin-top:2px}
      .sort-category-grid{gap:7px;margin-top:5px}
      .sort-category-btn{min-height:112px;padding:7px 4px;border-radius:18px}
      .sort-category-img{width:58px;height:58px}
      .sort-category-label{font-size:.95rem}
      .preview-grid{gap:7px;margin:12px 0}
      .preview-box{padding:8px 4px;border-radius:16px}
      .preview-box img{width:58px;height:58px}
      .preview-box strong{font-size:.9rem}

      #home .card{max-width:620px}
      .category-grid{gap:8px;margin:14px 0 18px}
      .category-btn{padding:12px 6px;border-radius:18px}
      .category-icon{width:68px;height:68px}
      .category-en{font-size:1rem}
      .category-zh{font-size:.82rem}

      body{min-height:100dvh}
      button{touch-action:manipulation;-webkit-user-select:none;user-select:none}

      .screen{
        min-height:var(--app-height,100dvh);
        padding:
          max(8px,env(safe-area-inset-top))
          10px
          max(8px,env(safe-area-inset-bottom));
      }

      #game.active{
        justify-content:flex-start;
      }

      .topbar{
        width:100%;
        max-width:560px;
        gap:8px;
        margin:0 0 8px;
        font-size:.95rem;
        align-items:stretch;
      }

      .pill{
        flex:1;
        padding:8px 10px;
        text-align:center;
        white-space:nowrap;
        box-shadow:0 3px 10px rgba(44,68,96,.09);
      }

      .question-card{
        width:100%;
        max-width:560px;
        padding:10px 12px 12px;
        border-radius:20px;
        box-shadow:0 8px 24px rgba(44,68,96,.10);
      }

      .question-card h2{
        font-size:clamp(1.25rem,5.4vw,1.6rem);
        line-height:1.1;
      }

      .speaker{
        width:50px;
        height:50px;
        font-size:1.45rem;
        margin:7px 0 5px;
        box-shadow:0 5px 0 #58b9ef;
      }

      .choices{
        grid-template-columns:1fr;
        gap:8px;
        margin-top:6px;
      }

      .choice{
        width:100%;
        height:clamp(96px,18.5dvh,128px);
        min-height:0;
        padding:8px 16px;
        border-radius:20px;
        flex-direction:row;
        justify-content:center;
        gap:20px;
        box-shadow:0 5px 14px rgba(47,65,90,.10),inset 0 0 0 3px #edf4fb;
      }

      .animal-img{
        width:clamp(76px,23vw,108px);
        height:clamp(76px,23vw,108px);
        flex:0 0 auto;
      }

      .choice .label{
        min-width:92px;
        margin-top:0;
        font-size:clamp(1.05rem,4.6vw,1.32rem);
        text-align:left;
      }

      .feedback{
        height:32px;
        margin-top:6px;
        font-size:clamp(1.05rem,4.5vw,1.35rem);
        line-height:32px;
      }

      .card{
        width:100%;
        padding:22px 16px;
        border-radius:24px;
      }

      .hero-images{
        gap:6px;
        margin:4px 0 12px;
      }

      .hero-images img{
        width:clamp(76px,24vw,110px);
        height:clamp(76px,24vw,110px);
      }

      .hero{font-size:6rem}
      .small-note{margin-top:14px}
    }

    /* 很矮的手機畫面：再壓縮高度 */
    @media(max-width:760px) and (max-height:650px){
      .screen{padding-top:6px;padding-bottom:6px}
      .topbar{margin-bottom:5px}
      .question-card{padding:7px 9px 8px}
      .speaker{width:44px;height:44px;font-size:1.25rem;margin:4px 0 3px}
      .choices{gap:5px;margin-top:4px}
      .choice{height:clamp(82px,17dvh,102px);padding:5px 12px;gap:14px}
      .animal-img{width:72px;height:72px}
      .feedback{height:27px;line-height:27px;margin-top:3px}
    }

    /* 手機橫向：三個選項並排，避免畫面太長 */
    @media(max-width:900px) and (orientation:landscape) and (max-height:520px){
      .screen{padding:6px 10px}
      #game.active{justify-content:flex-start}
      .topbar{max-width:920px;margin-bottom:5px}
      .question-card{max-width:920px;padding:7px 10px}
      .question-card h2{font-size:1.15rem}
      .speaker{width:40px;height:40px;font-size:1.15rem;margin:3px 0}
      .choices{grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
      .choice{
        height:clamp(118px,43dvh,155px);
        padding:6px;
        flex-direction:column;
        gap:4px;
      }
      .animal-img{width:76px;height:76px}
      .choice .label{min-width:0;text-align:center;font-size:1rem}
      .feedback{height:24px;line-height:24px;margin-top:2px;font-size:1rem}
    }

    /* 只有真的有滑鼠的裝置才套用hover，避免手機點擊殘留 */
    @media(hover:none){
      .choice:hover{
        transform:none;
        box-shadow:0 5px 14px rgba(47,65,90,.10),inset 0 0 0 3px #edf4fb;
      }
    }
  </style>
</head>
<body>
  <div id="stars" class="stars"></div>

  <section id="home" class="screen active">
    <div class="card">
      <h1>幼兒英文單字</h1>
      <p class="subtitle">Choose a game!</p>

      <div class="game-mode-grid">
        <button class="game-mode-btn" onclick="openListenMenu()">
          <img id="homeListenModeImage" class="mode-icon" alt="Listen and Find" decoding="async">
          <div class="mode-en">Listen &amp; Find</div>
          <div class="mode-zh">聽音找圖片</div>
        </button>

        <button class="game-mode-btn" onclick="openSortMenu()">
          <img class="mode-icon" src="images/fruits/apple.webp" alt="Sorting Game" loading="eager" decoding="async">
          <div class="mode-en">Sorting Game</div>
          <div class="mode-zh">分類遊戲</div>
        </button>
      </div>

      <div class="small-note">先選擇遊戲模式。</div>
    </div>
  </section>

  <section id="listenMenu" class="screen">
    <div class="card">
      <h1 class="menu-title">Listen &amp; Find</h1>
      <p class="subtitle">Choose a topic!</p>

      <div class="category-grid">
        <button class="category-btn" onclick="selectCategory('animals',this)">
          <img id="listenAnimalImage" class="category-icon" alt="Animals" decoding="async">
          <div class="category-en">Animals</div>
          <div class="category-zh">動物</div>
        </button>

        <button class="category-btn" onclick="selectCategory('fruits',this)">
          <img class="category-icon" src="images/fruits/apple.webp" alt="Fruits" decoding="async">
          <div class="category-en">Fruits</div>
          <div class="category-zh">水果</div>
        </button>

        <button class="category-btn" onclick="selectCategory('vehicles',this)">
          <img class="category-icon" src="images/vehicles/car.webp" alt="Vehicles" decoding="async">
          <div class="category-en">Vehicles</div>
          <div class="category-zh">交通工具</div>
        </button>
      </div>

      <button id="listenStartButton" class="big-btn" onclick="startGame()" disabled>
        ▶ 開始遊戲
      </button>

      <div id="listenHint" class="small-note">先選擇一個主題，再開始遊戲。</div>
      <button class="secondary-btn menu-back" onclick="backToHome()">← 回首頁</button>
    </div>
  </section>

  <section id="sortMenu" class="screen">
    <div class="card">
      <h1 class="menu-title">Sorting Game</h1>
      <p class="subtitle">把單字分到正確的類別</p>

      <div class="preview-grid">
        <div class="preview-box">
          <img id="sortPreviewAnimalImage" alt="Animals" decoding="async">
          <strong>Animals</strong>
        </div>
        <div class="preview-box">
          <img src="images/fruits/apple.webp" alt="Fruits" decoding="async">
          <strong>Fruits</strong>
        </div>
        <div class="preview-box">
          <img src="images/vehicles/car.webp" alt="Vehicles" decoding="async">
          <strong>Vehicles</strong>
        </div>
      </div>

      <button class="big-btn" onclick="startSortGame()">▶ 開始分類</button>
      <div class="small-note">看到圖片後，點選正確的分類。</div>
      <button class="secondary-btn menu-back" onclick="backToHome()">← 回首頁</button>
    </div>
  </section>

  <section id="game" class="screen">
    <div class="topbar">
      <div id="categoryLabel" class="pill topic-pill">Animals</div>
      <div class="pill">⭐ 分數：<span id="score">0</span></div>
      <div class="pill">第<span id="qnum">1</span>題/<span id="totalQuestions">10</span></div>
    </div>
    <div class="question-card">
      <h2 id="questionText">Find the dog!</h2>
      <button class="speaker" onclick="speakQuestion()" aria-label="播放題目語音">🔊</button>
      <div id="choices" class="choices"></div>
      <div id="feedback" class="feedback"></div>
    </div>
  </section>

  <section id="sortGame" class="screen">
    <div class="topbar">
      <div class="pill topic-pill">Sorting Game</div>
      <div class="pill">⭐ 分數：<span id="sortScore">0</span></div>
      <div class="pill">第<span id="sortQnum">1</span>題/<span id="sortTotalQuestions">10</span></div>
    </div>

    <div class="sort-card">
      <h2>Which group?</h2>
      <div class="drag-instruction">拖曳圖片到正確的分類框框</div>

      <div id="dragStage" class="drag-stage">
        <button id="dragItem" class="drag-item" type="button" aria-label="draggable word card">
          <img id="sortItemImage" class="sort-item-img" alt="" decoding="async">
          <div id="sortItemWord" class="sort-word"></div>
        </button>

        <div class="drop-zone-grid">
          <div id="dropZoneAnimals" class="drop-zone" data-category="animals">
            <img id="sortAnimalButtonImage" class="sort-category-img" alt="Animals" decoding="async">
            <div class="sort-category-label">Animals</div>
          </div>

          <div id="dropZoneFruits" class="drop-zone" data-category="fruits">
            <img class="sort-category-img" src="images/fruits/apple.webp" alt="Fruits" decoding="async">
            <div class="sort-category-label">Fruits</div>
          </div>

          <div id="dropZoneVehicles" class="drop-zone" data-category="vehicles">
            <img class="sort-category-img" src="images/vehicles/car.webp" alt="Vehicles" decoding="async">
            <div class="sort-category-label">Vehicles</div>
          </div>
        </div>
      </div>

      <div id="sortFeedback" class="feedback"></div>
    </div>
  </section>

  <section id="result" class="screen">
    <div class="card">
      <div class="hero">🎉</div>
      <h1>太棒了！</h1>
      <p id="resultSubtitle" class="subtitle">你完成關卡了！</p>
      <div class="result-score">
        <span id="finalScore">0</span>/<span id="finalTotal">10</span>
      </div>
      <div id="resultStars" class="result-stars">⭐⭐⭐⭐⭐</div>
      <button class="big-btn" onclick="restartCurrentGame()">↻ 再玩一次</button>
      <br>
      <button id="resultBackButton" class="secondary-btn" onclick="backFromResult()">← 回首頁</button>
    </div>
  </section>

    function getAudioContext(){
      if(!audioCtx){
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if(AudioContextClass){
          audioCtx = new AudioContextClass();
        }
      }

      if(audioCtx && audioCtx.state === 'suspended'){
        audioCtx.resume().catch(()=>{});
      }

      return audioCtx;
    }

    function playTone(freq, duration=.12, delay=0, volume=.055){
      const ctx = getAudioContext();
      if(!ctx) return;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.value = freq;

      const start = ctx.currentTime + delay;
      const end = start + duration;

      gain.gain.setValueAtTime(.0001,start);
      gain.gain.exponentialRampToValueAtTime(volume,start+.015);
      gain.gain.exponentialRampToValueAtTime(.0001,end);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(start);
      osc.stop(end+.02);
    }

    function playCategorySound(category){
      const notes = {
        animals:[523.25,659.25,783.99],
        fruits:[587.33,739.99,880.00],
        vehicles:[392.00,523.25,659.25]
      };

      const seq = notes[category] || notes.animals;
      seq.forEach((freq,i)=>playTone(freq,.12,i*.09,.06));
    }

    function playWrongSound(){
      playTone(220,.11,0,.04);
      playTone(185,.15,.10,.04);
    }

    const preloadedImages = new Map();

    function openListenMenu(){
      currentMode = 'listen';
      selectedCategory = null;

      document.querySelectorAll('#listenMenu .category-btn').forEach(btn=>{
        btn.classList.remove('selected');
      });

      const btn = document.getElementById('listenStartButton');
      btn.disabled = true;
      btn.textContent = '▶ 開始遊戲';

      document.getElementById('listenHint').textContent =
        '先選擇一個主題，再開始遊戲。';

      showScreen('listenMenu');
    }

    function openSortMenu(){
      currentMode = 'sort';
      showScreen('sortMenu');
    }

    function selectCategory(category,button){
      selectedCategory = category;

      document.querySelectorAll('#listenMenu .category-btn').forEach(btn=>{
        btn.classList.remove('selected');
      });

      button.classList.add('selected');

      document.getElementById('listenStartButton').disabled = false;
      document.getElementById('listenHint').textContent =
        `已選擇：${categoryInfo[category].label}`;

      // 選好主題後就在背景預載
      preloadCategory(category);
    }

    function preloadItems(items){
      const jobs = items.map(item=>{
        if(preloadedImages.has(item.image)){
          return Promise.resolve();
        }

        return new Promise(resolve=>{
          const img = new Image();
          img.decoding = 'async';
          img.onload = ()=>{
            preloadedImages.set(item.image,img);
            if(img.decode){
              img.decode().catch(()=>{}).finally(resolve);
            }else{
              resolve();
            }
          };
          img.onerror = resolve;
          img.src = item.image;
        });
      });

      return Promise.all(jobs);
    }

    function preloadCategory(category){
      return preloadItems(categories[category] || []);
    }

    function shuffle(arr){
      return [...arr].sort(()=>Math.random()-0.5);
    }

    function makeQuestions(){
      const items = categories[selectedCategory];
      const count = Math.min(QUESTION_COUNT,items.length);
      const targets = shuffle(items).slice(0,count);

      return targets.map(target=>{
        const wrong = shuffle(
          items.filter(item=>item.word!==target.word)
        ).slice(0,2);

        return {
          target,
          options:shuffle([target,...wrong])
        };
      });
    }

    function makeSortQuestions(){
      const allItems = [
        ...animals.map(item=>({...item,category:'animals'})),
        ...fruits.map(item=>({...item,category:'fruits'})),
        ...vehicles.map(item=>({...item,category:'vehicles'}))
      ];

      return shuffle(allItems).slice(0,Math.min(QUESTION_COUNT,allItems.length));
    }

    function showScreen(id){
      document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      window.scrollTo(0,0);
    }

    async function startGame(){
      if(!selectedCategory) return;

      currentMode = 'listen';
      speechSynthesis.cancel();

      const startButton = document.getElementById('listenStartButton');
      startButton.disabled = true;
      startButton.textContent = '載入中...';

      await preloadCategory(selectedCategory);

      questions = makeQuestions();
      current = 0;
      score = 0;
      locked = false;

      document.getElementById('score').textContent = score;
      document.getElementById('totalQuestions').textContent = questions.length;
      document.getElementById('categoryLabel').textContent =
        categoryInfo[selectedCategory].label;

      startButton.disabled = false;
      startButton.textContent = '▶ 開始遊戲';

      showScreen('game');
      renderQuestion();
    }

    async function startSortGame(){
      currentMode = 'sort';
      speechSynthesis.cancel();

      sortQuestions = makeSortQuestions();
      sortCurrent = 0;
      sortScore = 0;
      sortLocked = false;

      document.getElementById('sortScore').textContent = sortScore;
      document.getElementById('sortTotalQuestions').textContent = sortQuestions.length;

      // 只預載這一局會出現的10張，避免手機一次載入全部題庫
      await preloadItems(sortQuestions);

      showScreen('sortGame');
      renderSortQuestion();
    }

    function backToHome(){
      speechSynthesis.cancel();
      showScreen('home');
    }

    function renderQuestion(){
      locked = false;
      const q = questions[current];
      document.getElementById('qnum').textContent = current+1;
      document.getElementById('questionText').textContent = `Find the ${q.target.word}!`;
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';

      const box = document.getElementById('choices');
      box.innerHTML='';
      q.options.forEach(opt=>{
        const btn = document.createElement('button');
        btn.className='choice';
        btn.innerHTML=`<img class="animal-img" src="${opt.image}" alt="${opt.word}" decoding="async"><div class="label">${capitalize(opt.word)}</div>`;
        btn.onclick=()=>{
          btn.classList.add('reveal-label');
          checkAnswer(opt,btn);
        };
        box.appendChild(btn);
      });

      setTimeout(speakQuestion,350);
    }


    function centerDragItem(){
      const stage = document.getElementById('dragStage');
      const item = document.getElementById('dragItem');
      if(!stage || !item) return;

      item.classList.add('snap-back');

      const stageRect = stage.getBoundingClientRect();
      const itemRect = item.getBoundingClientRect();

      const left = (stageRect.width - itemRect.width) / 2;
      const top = 18;

      item.style.left = `${left}px`;
      item.style.top = `${top}px`;
      item.style.transform = 'none';

      setTimeout(()=>item.classList.remove('snap-back'),240);
    }

    function clearDropZoneState(){
      document.querySelectorAll('.drop-zone').forEach(zone=>{
        zone.classList.remove('active-zone','correct','wrong');
      });
    }

    function getZoneFromPoint(x,y){
      const zones = [...document.querySelectorAll('.drop-zone')];
      for(const zone of zones){
        const rect = zone.getBoundingClientRect();
        if(x>=rect.left && x<=rect.right && y>=rect.top && y<=rect.bottom){
          return zone;
        }
      }
      return null;
    }

    function highlightZoneAtPoint(x,y){
      clearDropZoneState();
      const zone = getZoneFromPoint(x,y);
      if(zone){
        zone.classList.add('active-zone');
      }
      return zone;
    }

    function renderSortQuestion(){
      sortLocked = false;

      const q = sortQuestions[sortCurrent];

      document.getElementById('sortQnum').textContent = sortCurrent+1;
      document.getElementById('sortItemImage').src = q.image;
      document.getElementById('sortItemImage').alt = q.word;
      document.getElementById('sortItemWord').textContent = capitalize(q.word);

      const feedback = document.getElementById('sortFeedback');
      feedback.textContent = '';
      feedback.className = 'feedback';

      clearDropZoneState();

      const item = document.getElementById('dragItem');
      item.classList.remove('dragging','fly-in');
      item.style.transition = '';
      item.style.opacity = '1';
      item.style.transform = 'none';
      requestAnimationFrame(centerDragItem);

      setTimeout(()=>speak(q.word,.82),250);
    }

    function flyItemIntoZone(zone,onDone){
      const stage = document.getElementById('dragStage');
      const item = document.getElementById('dragItem');

      if(!stage || !item || !zone){
        if(onDone) onDone();
        return;
      }

      const stageRect = stage.getBoundingClientRect();
      const itemRect = item.getBoundingClientRect();
      const zoneRect = zone.getBoundingClientRect();

      // 目標點：分類框中央
      const targetLeft =
        zoneRect.left - stageRect.left +
        (zoneRect.width - itemRect.width) / 2;

      const targetTop =
        zoneRect.top - stageRect.top +
        (zoneRect.height - itemRect.height) / 2;

      item.classList.remove('snap-back','dragging');
      item.classList.add('fly-in');

      // 先固定目前位置，確保動畫從手指放開的位置開始
      item.style.left = `${itemRect.left - stageRect.left}px`;
      item.style.top = `${itemRect.top - stageRect.top}px`;
      item.style.transform = 'none';
      item.style.opacity = '1';

      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          item.style.left = `${targetLeft}px`;
          item.style.top = `${targetTop}px`;
          item.style.transform = 'scale(.38) rotate(4deg)';
          item.style.opacity = '.35';
        });
      });

      setTimeout(()=>{
        if(onDone) onDone();
      },430);
    }

    function handleSortDrop(category,zone){
      if(sortLocked) return;

      const q = sortQuestions[sortCurrent];
      const feedback = document.getElementById('sortFeedback');
      clearDropZoneState();

      if(category===q.category){
        sortLocked = true;
        zone.classList.add('correct');

        // 分類框發光＋分類專屬音效
        playCategorySound(category);

        // 卡片真的飛進分類框
        flyItemIntoZone(zone,()=>{
          sortScore++;
          document.getElementById('sortScore').textContent = sortScore;

          feedback.textContent = '答對了！⭐';
          feedback.className = 'feedback good';

          burstStars();
          speak('Great job!');

          setTimeout(()=>{
            sortCurrent++;
            if(sortCurrent>=sortQuestions.length){
              finishGame();
            }else{
              renderSortQuestion();
            }
          },650);
        });
      }else{
        zone.classList.add('wrong');
        feedback.textContent = '再試一次！';
        feedback.className = 'feedback bad';

        playWrongSound();
        speak('Try again');

        centerDragItem();
        setTimeout(()=>zone.classList.remove('wrong'),450);
      }
    }

    function initSortDrag(){
      const stage = document.getElementById('dragStage');
      const item = document.getElementById('dragItem');
      if(!stage || !item) return;

      item.addEventListener('pointerdown',e=>{
        if(sortLocked) return;
        e.preventDefault();

        // iOS/Android需要使用者互動後才允許播放Web Audio
        getAudioContext();

        const stageRect = stage.getBoundingClientRect();
        const itemRect = item.getBoundingClientRect();

        dragState.pointerId = e.pointerId;
        dragState.active = true;
        dragState.startX = e.clientX;
        dragState.startY = e.clientY;
        dragState.offsetX = e.clientX - itemRect.left;
        dragState.offsetY = e.clientY - itemRect.top;
        dragState.itemStartLeft = itemRect.left - stageRect.left;
        dragState.itemStartTop = itemRect.top - stageRect.top;

        item.setPointerCapture(e.pointerId);
        item.classList.add('dragging');
        item.classList.remove('snap-back');
        item.style.transform = 'none';
        item.style.left = `${dragState.itemStartLeft}px`;
        item.style.top = `${dragState.itemStartTop}px`;
      });

      item.addEventListener('pointermove',e=>{
        if(!dragState.active || dragState.pointerId!==e.pointerId || sortLocked) return;
        e.preventDefault();

        const stageRect = stage.getBoundingClientRect();
        const itemRect = item.getBoundingClientRect();

        let left = e.clientX - stageRect.left - dragState.offsetX;
        let top = e.clientY - stageRect.top - dragState.offsetY;

        const maxLeft = stageRect.width - itemRect.width;
        const maxTop = stageRect.height - itemRect.height;

        left = Math.max(0,Math.min(left,maxLeft));
        top = Math.max(0,Math.min(top,maxTop));

        item.style.left = `${left}px`;
        item.style.top = `${top}px`;

        highlightZoneAtPoint(e.clientX,e.clientY);
      });

      const finishPointer = e=>{
        if(!dragState.active || dragState.pointerId!==e.pointerId) return;

        dragState.active = false;
        item.classList.remove('dragging');

        let zone = null;
        if(!sortLocked){
          zone = getZoneFromPoint(e.clientX,e.clientY);
        }

        if(item.hasPointerCapture(e.pointerId)){
          item.releasePointerCapture(e.pointerId);
        }

        if(zone){
          handleSortDrop(zone.dataset.category,zone);
        }else{
          clearDropZoneState();
          centerDragItem();
        }
      };

      item.addEventListener('pointerup',finishPointer);
      item.addEventListener('pointercancel',finishPointer);

      // 輔助：點一下分類框也能判斷，避免幼兒還不會拖曳
      document.querySelectorAll('.drop-zone').forEach(zone=>{
        zone.addEventListener('click',()=>{
          if(sortLocked) return;
          getAudioContext();
          handleSortDrop(zone.dataset.category,zone);
        });
      });

      window.addEventListener('resize',()=>{
        if(document.getElementById('sortGame').classList.contains('active')){
          centerDragItem();
        }
      });
    }

    function speakQuestion(){
      if(!questions[current]) return;
      speechSynthesis.cancel();
      const text = `Find the ${questions[current].target.word}`;
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang='en-US';
      utter.rate=.82;
      utter.pitch=1.08;
      utter.volume=1;
      speechSynthesis.speak(utter);
    }

    function speak(text, rate=.9){
      speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang='en-US';
      utter.rate=rate;
      utter.pitch=1.12;
      speechSynthesis.speak(utter);
    }

    function checkAnswer(opt,btn){
      if(locked) return;
      const q = questions[current];
      const feedback = document.getElementById('feedback');

      if(opt.word===q.target.word){
        locked=true;
        btn.classList.add('correct');
        score++;
        document.getElementById('score').textContent=score;
        feedback.textContent='答對了！⭐';
        feedback.className='feedback good';
        burstStars();
        speak('Great job!');
        setTimeout(()=>{
          current++;
          if(current>=questions.length){finishGame();}
          else{renderQuestion();}
        },1100);
      }else{
        btn.classList.remove('wrong');
        void btn.offsetWidth;
        btn.classList.add('wrong');
        feedback.textContent='再試一次！';
        feedback.className='feedback bad';
        speak('Try again');
        setTimeout(()=>btn.classList.remove('wrong'),450);
      }
    }

    function burstStars(){
      const layer=document.getElementById('stars');
      const icons=['⭐','🌟','✨','💫'];
      for(let i=0;i<12;i++){
        const el=document.createElement('div');
        el.className='star';
        el.textContent=icons[Math.floor(Math.random()*icons.length)];
        el.style.left=(20+Math.random()*60)+'vw';
        el.style.top=(45+Math.random()*25)+'vh';
        el.style.animationDelay=(Math.random()*.15)+'s';
        el.style.fontSize=(1.5+Math.random()*1.8)+'rem';
        layer.appendChild(el);
        setTimeout(()=>el.remove(),1500);
      }
    }

    function finishGame(){
      showScreen('result');

      const isSort = currentMode==='sort';
      const earnedScore = isSort ? sortScore : score;
      const total = isSort ? sortQuestions.length : questions.length;

      document.getElementById('finalScore').textContent = earnedScore;
      document.getElementById('finalTotal').textContent = total;

      if(isSort){
        document.getElementById('resultSubtitle').textContent =
          '你完成分類遊戲了！';
        document.getElementById('resultBackButton').textContent =
          '← 回首頁';
      }else{
        document.getElementById('resultSubtitle').textContent =
          categoryInfo[selectedCategory].result;
        document.getElementById('resultBackButton').textContent =
          '← 選其他主題';
      }

      const ratio = total ? earnedScore/total : 0;
      const starCount =
        ratio>=.9?5:
        ratio>=.7?4:
        ratio>=.5?3:
        ratio>=.3?2:1;

      document.getElementById('resultStars').textContent='⭐'.repeat(starCount);
      burstStars();
      speak(ratio>=.8?'Awesome! Great job!':'Good job!');
    }

    function restartCurrentGame(){
      if(currentMode==='sort'){
        startSortGame();
      }else{
        startGame();
      }
    }

    function backFromResult(){
      speechSynthesis.cancel();

      if(currentMode==='listen'){
        showScreen('listenMenu');
      }else{
        showScreen('home');
      }
    }

    function capitalize(s){return s.charAt(0).toUpperCase()+s.slice(1)}
  </script>
</body>
</html>
